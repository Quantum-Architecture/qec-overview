<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-label="QEC — the path of one agent decision" font-family="Inter,ui-sans-serif,system-ui,sans-serif"><defs><marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d3a84f"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9877a"/></marker></defs><rect width="1200" height="575" fill="#070708"/><text x="24" y="34.0" font-size="20" fill="#f4d98f" font-weight="600" text-anchor="start">QEC — the path of one agent decision</text><rect x="24" y="130" width="100" height="70" fill="#0b0b0c" stroke="#5a4a2a"/><text x="74" y="158.0" font-size="14" fill="#f1eadb" font-weight="500" text-anchor="middle">Agent</text><text x="74" y="176.2" font-size="14" fill="#f1eadb" font-weight="500" text-anchor="middle">request</text><rect x="164" y="110" width="235" height="120" fill="#0b0b0c" stroke="#5a4a2a" stroke-width="1"/><rect x="164" y="110" width="4" height="120" fill="#d3a84f"/><text x="180" y="140.0" font-size="15" fill="#f1eadb" font-weight="600" text-anchor="start">1 · Policy before execution</text><text x="180" y="166.0" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">allow-listed tools,</text><text x="180" y="183.6" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">ceilings, recipients,</text><text x="180" y="201.1" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">approved vendors</text><rect x="439" y="110" width="235" height="120" fill="#0b0b0c" stroke="#5a4a2a" stroke-width="1"/><rect x="439" y="110" width="4" height="120" fill="#d3a84f"/><text x="455" y="140.0" font-size="15" fill="#f1eadb" font-weight="600" text-anchor="start">2 · Decimal budget</text><text x="455" y="166.0" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">exact cost meter,</text><text x="455" y="183.6" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">floats refused,</text><text x="455" y="201.1" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">daily ceiling</text><rect x="714" y="110" width="235" height="120" fill="#0b0b0c" stroke="#5a4a2a" stroke-width="1"/><rect x="714" y="110" width="4" height="120" fill="#d3a84f"/><text x="730" y="140.0" font-size="15" fill="#f1eadb" font-weight="600" text-anchor="start">3 · Signed delegation</text><text x="730" y="166.0" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">sub-agent ⊆ parent,</text><text x="730" y="183.6" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">Ed25519, non-escalating,</text><text x="730" y="201.1" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">proof of possession</text><rect x="989" y="110" width="187" height="120" fill="#0b0b0c" stroke="#5a4a2a" stroke-width="1"/><rect x="989" y="110" width="4" height="120" fill="#f4d98f"/><text x="1005" y="140.0" font-size="15" fill="#f1eadb" font-weight="600" text-anchor="start">Execution</text><text x="1005" y="166.0" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">tool, payment,</text><text x="1005" y="183.6" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">e-mail, model</text><rect x="164" y="52" width="235" height="40" fill="#0b0b0c" stroke="#5a4a2a" stroke-dasharray="4 3"/><text x="174" y="70.0" font-size="13" fill="#f1eadb" font-weight="600" text-anchor="start">DriftSentinel</text><text x="174" y="86.0" font-size="11.5" fill="#a79f92" font-weight="normal" text-anchor="start">configuration hash · fail-closed</text><line x1="281" y1="92" x2="281" y2="110" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="124" y1="165" x2="164" y2="165" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="399" y1="170" x2="439" y2="170" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="674" y1="170" x2="714" y2="170" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><line x1="949" y1="170" x2="989" y2="170" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><rect x="24" y="330" width="1151" height="92" fill="#0b0b0c" stroke="#d3a84f" stroke-width="1.2"/><rect x="24" y="330" width="1151" height="4" fill="#d3a84f"/><text x="40" y="362.0" font-size="17" fill="#f1eadb" font-weight="600" text-anchor="start">AuditChain — SHA-256 chained ledger</text><text x="40" y="386.0" font-size="13" fill="#a79f92" font-weight="normal" text-anchor="start">one JSON line per decision and per refusal · prev_hash → hash · UTC timestamp · Ed25519 signature</text><text x="40" y="410" font-size="12.5" fill="#f4d98f" font-family="ui-monospace,Menlo,Consolas,monospace">{"seq":7,"kind":"refused","code":"amount_over_ceiling","prev_hash":"3f9c…","hash":"a41e…"}</text><line x1="281.5" y1="230" x2="281.5" y2="330" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><line x1="556.5" y1="230" x2="556.5" y2="330" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><line x1="831.5" y1="230" x2="831.5" y2="330" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><line x1="1082" y1="230" x2="1082" y2="330" stroke="#d3a84f" stroke-width="1.6" marker-end="url(#ag)"/><text x="1082.0" y="300" font-size="12" fill="#d3a84f" text-anchor="middle">output</text><rect x="905" y="445" width="271" height="96" fill="#0b0b0c" stroke="#5a4a2a" stroke-width="1"/><rect x="905" y="445" width="4" height="96" fill="#9fd8a2"/><text x="921" y="475.0" font-size="15" fill="#f1eadb" font-weight="600" text-anchor="start">Third-party verifier</text><text x="921" y="501.0" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">ledger-verify (Python or JS)</text><text x="921" y="518.5" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">offline, no secret key</text><text x="921" y="536.1" font-size="13.5" fill="#a79f92" font-weight="normal" text-anchor="start">VALID / INVALID + faulty line</text><line x1="1040" y1="422" x2="1040" y2="445" stroke="#9fd8a2" stroke-width="1.6" marker-end="url(#ag)"/><text x="24" y="566.0" font-size="12.5" fill="#a79f92" font-weight="normal" text-anchor="start">No external dependency · standard Python · no data transmitted · 314 automated tests (QEC 3.5.2)</text><line x1="40" y1="470" x2="80" y2="470" stroke="#d3a84f" stroke-width="1.6"/><text x="88" y="474.0" font-size="12.5" fill="#a79f92" font-weight="normal" text-anchor="start">allowed</text><line x1="40" y1="496" x2="80" y2="496" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="5 4"/><text x="88" y="500.0" font-size="12.5" fill="#a79f92" font-weight="normal" text-anchor="start">refused → journaled</text></svg>